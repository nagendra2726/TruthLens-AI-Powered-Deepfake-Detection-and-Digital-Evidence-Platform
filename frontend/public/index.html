    <script>
      // Check for dark mode preference at the OS level or localStorage
      try {
        if (localStorage.getItem('deepsafeDarkMode') === 'true' || 
            (!localStorage.getItem('deepsafeDarkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // If localStorage is not available
      }
    </script>
